  <span id="wa-label">Sipariş Ver</span>
</a>

<script>
  var currentLang = 'tr';
  var strings = {
    tr: { order: 'Sipariş Ver', flag: '🇬🇧', label: 'EN' },
    en: { order: 'Order Now',   flag: '🇹🇷', label: 'TR' }
  };

  // Tabları ve panelleri MENU_DATA'dan otomatik oluştur
  function buildMenu() {
    var tabsContainer = document.getElementById('tabs-container');
    var panelsContainer = document.getElementById('panels-container');

    TABS.forEach(function(tab, i) {
      // Tab butonu
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.id = 'tab-' + tab.key;
      btn.setAttribute('data-tr', tab.tr);
      btn.setAttribute('data-en', tab.en);
      btn.innerText = tab.tr;
      btn.onclick = function() { switchTab(tab.key, btn); };
      tabsContainer.appendChild(btn);

      // Panel
      var panel = document.createElement('div');
      panel.id = 'panel-' + tab.key;
      panel.className = 'tab-panel' + (i === 0 ? ' active' : '');

      var list = document.createElement('div');
      list.className = 'menu-list';

      (MENU_DATA[tab.key] || []).forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML =
          '<div class="item-img"><img src="' + item.img + '" alt="' + item.tr + '" loading="lazy"/></div>' +
          '<div class="item-info">' +
            '<div class="item-name" data-tr="' + item.tr + '" data-en="' + item.en + '">' + item.tr + '</div>' +
            '<div class="item-desc" data-tr="' + item.descTr + '" data-en="' + item.descEn + '">' + item.descTr + '</div>' +
            '<div class="item-price">&#8378;' + item.price + '</div>' +
          '</div>';
        list.appendChild(div);
      });

      panel.appendChild(list);
      panelsContainer.appendChild(panel);
    });
  }

  function calcTabWidth() {
    var tabs = document.querySelectorAll('.tab-btn');
    var bar = document.getElementById('tabs-bar');
    var containerWidth = Math.min(Math.max(bar.offsetWidth, 300), 600);
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    var maxWordWidth = 0;
    tabs.forEach(function(btn) {
      var trWords = (btn.getAttribute('data-tr') || '').toUpperCase().replace(/\n/g, ' ').split(' ');
      var enWords = (btn.getAttribute('data-en') || '').toUpperCase().replace(/\n/g, ' ').split(' ');
      trWords.concat(enWords).forEach(function(word) {
        if (word) maxWordWidth = Math.max(maxWordWidth, ctx.measureText(word).width);
      });
    });
    var minTabWidth = Math.ceil(maxWordWidth) + 32;
    var fitsFloat = containerWidth / minTabWidth;
    var half = Math.floor(fitsFloat) + 0.5;
    if (half < 3.5) half = 3.5;
    var tabWidth = Math.floor(containerWidth / half);
    tabs.forEach(function(btn) { btn.style.width = tabWidth + 'px'; });
  }

  function applyLang(lang) {
    currentLang = lang;
    var s = strings[lang];
    document.getElementById('wa-label').textContent   = s.order;
    document.getElementById('lang-flag').textContent  = s.flag;
    document.getElementById('lang-label').textContent = s.label;
    document.querySelectorAll('[data-tr]').forEach(function(el) {
      if (el.classList.contains('tab-btn')) {
        el.innerText = el.getAttribute('data-' + lang);
      } else {
        el.textContent = el.getAttribute('data-' + lang);
      }
    });
    document.documentElement.lang = lang;
    calcTabWidth();
  }

  function setLang(lang) {
    document.getElementById('lang-screen').style.display = 'none';
    document.getElementById('menu').classList.add('visible');
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('wa-btn').classList.add('visible');
    applyLang(lang);
  }

  function toggleLang() { applyLang(currentLang === 'tr' ? 'en' : 'tr'); }

  function switchTab(key, btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('panel-' + key).classList.add('active');
    btn.classList.add('active');
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  window.addEventListener('resize', calcTabWidth);
  buildMenu();
</script>
</body>
</html>
